name: Build QuickSkip APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug Signed APK
        run: gradle assembleDebug --stacktrace

      - name: Run APK Security Analyzer
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          
          # 动态查找 apkanalyzer，杜绝路径不存在问题
          APKANALYZER=$(find $ANDROID_HOME -name apkanalyzer -type f 2>/dev/null | head -n 1)
          if [ -n "$APKANALYZER" ]; then
            echo "=================================================="
            echo "🔍 【安全审计 1】AndroidManifest.xml 完整权限与组件声明"
            echo "=================================================="
            "$APKANALYZER" manifest print "$APK"
            
            echo "=================================================="
            echo "🔍 【安全审计 2】DEX 依赖包名树 (验证无第三方可疑 SDK)"
            echo "=================================================="
            "$APKANALYZER" dex packages "$APK"
          else
            echo "apkanalyzer not found, inspecting via aapt:"
            AAPT=$(find $ANDROID_HOME -name aapt -type f 2>/dev/null | head -n 1)
            "$AAPT" dump permissions "$APK"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSkip-v1.2-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
