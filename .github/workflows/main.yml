name: Build QuickSkip APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Sign Release APK
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS"
          
          # 生成临时签名密钥
          keytool -genkeypair -v -keystore release.jks -alias quickskip -keyalg RSA -keysize 2048 -validity 10000 -storepass quickskip123 -keypass quickskip123 -dname "CN=QuickSkip, O=QuickSkipApp"
          
          # 查找生成的 APK 并完成签名
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:quickskip123 --out app/build/outputs/apk/release/QuickSkip-v1.2-Release.apk "$UNSIGNED_APK"

      - name: Run APK Security Analyzer
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -n 1)
          TARGET_APK="app/build/outputs/apk/release/QuickSkip-v1.2-Release.apk"
          
          echo "=================================================="
          echo "🔍 【安全审计 1】AndroidManifest.xml 完整权限与组件声明"
          echo "=================================================="
          $BUILD_TOOLS/apkanalyzer manifest print "$TARGET_APK"
          
          echo "=================================================="
          echo "🔍 【安全审计 2】DEX 依赖包名树 (验证无第三方可疑 SDK)"
          echo "=================================================="
          $BUILD_TOOLS/apkanalyzer dex packages "$TARGET_APK"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickSkip-v1.2-Release-APK
          path: app/build/outputs/apk/release/QuickSkip-v1.2-Release.apk
          retention-days: 14
